name: Load

on:
  workflow_dispatch:

jobs:
  load:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 600 gateway zipkin

      - name: Run the load simulation
        run: ./mvnw --batch-mode --no-transfer-progress -pl load test-compile gatling:test -Dusers=10 -Dduration=60 -DcheckLatency=false

      - name: Upload the Gatling report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gatling-report
          path: load/target/gatling/

      - name: Show the service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
