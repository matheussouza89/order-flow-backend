spring:
  application:
    name: gateway

  http:
    clients:
      connect-timeout: 1s
      read-timeout: 4500ms

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: orders
              uri: ${ORDERS_URL:http://orders:8080}
              predicates:
                - Path=/orders/**
              filters:
                - PreserveHostHeader
            - id: identity
              uri: ${IDENTITY_URL:http://identity:8080}
              predicates:
                - Path=/auth/**,/users/**
              filters:
                - PreserveHostHeader
            - id: cart
              uri: ${CART_URL:http://cart:8080}
              predicates:
                - Path=/cart/**
              filters:
                - PreserveHostHeader
            - id: catalog
              uri: ${CATALOG_URL:http://catalog:8080}
              predicates:
                - Path=/products/**
              filters:
                - PreserveHostHeader
            - id: payment
              uri: ${PAYMENT_URL:http://payment:8080}
              predicates:
                - Path=/payments/**
              filters:
                - PreserveHostHeader
            - id: sales
              uri: ${SALES_URL:http://sales:8080}
              predicates:
                - Path=/admin/sales/**
              filters:
                - PreserveHostHeader
            - id: orders-docs
              uri: ${ORDERS_URL:http://orders:8080}
              predicates:
                - Path=/v3/api-docs/orders
              filters:
                - PreserveHostHeader
                - SetPath=/v3/api-docs
            - id: identity-docs
              uri: ${IDENTITY_URL:http://identity:8080}
              predicates:
                - Path=/v3/api-docs/identity
              filters:
                - PreserveHostHeader
                - SetPath=/v3/api-docs
            - id: cart-docs
              uri: ${CART_URL:http://cart:8080}
              predicates:
                - Path=/v3/api-docs/cart
              filters:
                - PreserveHostHeader
                - SetPath=/v3/api-docs
            - id: catalog-docs
              uri: ${CATALOG_URL:http://catalog:8080}
              predicates:
                - Path=/v3/api-docs/catalog
              filters:
                - PreserveHostHeader
                - SetPath=/v3/api-docs
            - id: payment-docs
              uri: ${PAYMENT_URL:http://payment:8080}
              predicates:
                - Path=/v3/api-docs/payment
              filters:
                - PreserveHostHeader
                - SetPath=/v3/api-docs
            - id: sales-docs
              uri: ${SALES_URL:http://sales:8080}
              predicates:
                - Path=/v3/api-docs/sales
              filters:
                - PreserveHostHeader
                - SetPath=/v3/api-docs

management:
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

springdoc:
  swagger-ui:
    urls:
      - name: orders
        url: /v3/api-docs/orders
      - name: identity
        url: /v3/api-docs/identity
      - name: cart
        url: /v3/api-docs/cart
      - name: catalog
        url: /v3/api-docs/catalog
      - name: payment
        url: /v3/api-docs/payment
      - name: sales
        url: /v3/api-docs/sales
