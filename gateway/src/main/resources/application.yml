spring:
  application:
    name: gateway

  http:
    clients:
      connect-timeout: 1s
      read-timeout: 4500ms

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: monolith
              uri: ${MONOLITH_URL:http://monolith:8080}
              predicates:
                - Path=/auth/**,/users/**,/cart/**,/orders/**
              filters:
                - PreserveHostHeader
            - id: catalog
              uri: ${CATALOG_URL:http://catalog:8080}
              predicates:
                - Path=/products/**
              filters:
                - PreserveHostHeader
            - id: payment
              uri: ${PAYMENT_URL:http://payment:8080}
              predicates:
                - Path=/payments/**
              filters:
                - PreserveHostHeader
            - id: sales
              uri: ${SALES_URL:http://sales:8080}
              predicates:
                - Path=/admin/sales/**
              filters:
                - PreserveHostHeader
            - id: monolith-docs
              uri: ${MONOLITH_URL:http://monolith:8080}
              predicates:
                - Path=/v3/api-docs/monolith
              filters:
                - PreserveHostHeader
                - SetPath=/v3/api-docs
            - id: catalog-docs
              uri: ${CATALOG_URL:http://catalog:8080}
              predicates:
                - Path=/v3/api-docs/catalog
              filters:
                - PreserveHostHeader
                - SetPath=/v3/api-docs
            - id: payment-docs
              uri: ${PAYMENT_URL:http://payment:8080}
              predicates:
                - Path=/v3/api-docs/payment
              filters:
                - PreserveHostHeader
                - SetPath=/v3/api-docs
            - id: sales-docs
              uri: ${SALES_URL:http://sales:8080}
              predicates:
                - Path=/v3/api-docs/sales
              filters:
                - PreserveHostHeader
                - SetPath=/v3/api-docs

management:
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

springdoc:
  swagger-ui:
    urls:
      - name: monolith
        url: /v3/api-docs/monolith
      - name: catalog
        url: /v3/api-docs/catalog
      - name: payment
        url: /v3/api-docs/payment
      - name: sales
        url: /v3/api-docs/sales
