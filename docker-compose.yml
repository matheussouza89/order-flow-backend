
services:
  gateway:
    build:
      context: .
      args:
        MODULE: gateway
    restart: unless-stopped
    environment:
      ORDERS_URL: http://orders:8080
      SALES_URL: http://sales:8080
      PAYMENT_URL: http://payment:8080
      CATALOG_URL: http://catalog:8080
      CART_URL: http://cart:8080
      IDENTITY_URL: http://identity:8080
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      JAVA_TOOL_OPTIONS: -Xmx256m
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    depends_on:
      orders:
        condition: service_healthy
      sales:
        condition: service_healthy
      payment:
        condition: service_healthy
      catalog:
        condition: service_healthy
      cart:
        condition: service_healthy
      identity:
        condition: service_healthy
    networks:
      - orderflow-network

  identity:
    build:
      context: .
      args:
        MODULE: services/identity
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/identity
      SPRING_DATASOURCE_USERNAME: identity
      SPRING_DATASOURCE_PASSWORD: identity
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_USERNAME: identity
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_IDENTITY_PASSWORD:-identity}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@orderflow.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-in-production}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      JAVA_TOOL_OPTIONS: -Xmx256m
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - orderflow-network

  orders:
    build:
      context: .
      args:
        MODULE: services/orders
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/orders
      SPRING_DATASOURCE_USERNAME: orders
      SPRING_DATASOURCE_PASSWORD: orders
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: orders
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_ORDERS_PASSWORD:-orders}
      CATALOG_URL: http://catalog:8080
      JWK_SET_URI: http://identity:8080/.well-known/jwks.json
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      JAVA_TOOL_OPTIONS: -Xmx256m
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq-users:
        condition: service_completed_successfully
    networks:
      - orderflow-network

  sales:
    build:
      context: .
      args:
        MODULE: services/sales
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://sales:${MONGO_SALES_PASSWORD:-sales}@mongo:27017/orderflow
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: sales
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_SALES_PASSWORD:-sales}
      JWK_SET_URI: http://identity:8080/.well-known/jwks.json
      ORDERS_URL: http://orders:8080
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      JAVA_TOOL_OPTIONS: -Xmx256m
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
    depends_on:
      rabbitmq-users:
        condition: service_completed_successfully
      mongo:
        condition: service_started
    networks:
      - orderflow-network

  payment:
    build:
      context: .
      args:
        MODULE: services/payment
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payment
      SPRING_DATASOURCE_USERNAME: payment
      SPRING_DATASOURCE_PASSWORD: payment
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: payment
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PAYMENT_PASSWORD:-payment}
      PAYMENT_GATEWAY_URL: http://wiremock:8080
      JWK_SET_URI: http://identity:8080/.well-known/jwks.json
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      JAVA_TOOL_OPTIONS: -Xmx256m
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq-users:
        condition: service_completed_successfully
      wiremock:
        condition: service_started
    networks:
      - orderflow-network

  catalog:
    build:
      context: .
      args:
        MODULE: services/catalog
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/catalog
      SPRING_DATASOURCE_USERNAME: catalog
      SPRING_DATASOURCE_PASSWORD: catalog
      JWK_SET_URI: http://identity:8080/.well-known/jwks.json
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      JAVA_TOOL_OPTIONS: -Xmx256m
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - orderflow-network

  cart:
    build:
      context: .
      args:
        MODULE: services/cart
    restart: unless-stopped
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_USERNAME: cart
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_CART_PASSWORD:-cart}
      CATALOG_URL: http://catalog:8080
      ORDERS_URL: http://orders:8080
      JWK_SET_URI: http://identity:8080/.well-known/jwks.json
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      JAVA_TOOL_OPTIONS: -Xmx256m
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
    depends_on:
      redis:
        condition: service_started
    networks:
      - orderflow-network

  wiremock:
    image: wiremock/wiremock:3.9.1
    restart: unless-stopped
    command: ["--global-response-templating", "--verbose"]
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings
    ports:
      - "8090:8080"
    networks:
      - orderflow-network

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: orderflow
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot", "-uroot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - orderflow-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [
      "redis-server",
      "--user", "default", "off",
      "--user", "identity", "on", ">${REDIS_IDENTITY_PASSWORD:-identity}", "~refreshToken*", "+@all", "-@dangerous", "+info",
      "--user", "cart", "on", ">${REDIS_CART_PASSWORD:-cart}", "~cart*", "+@all", "-@dangerous", "+info"
    ]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - orderflow-network

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-root}
      MONGO_SALES_PASSWORD: ${MONGO_SALES_PASSWORD:-sales}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo/init:/docker-entrypoint-initdb.d:ro
    networks:
      - orderflow-network

  zipkin:
    image: openzipkin/zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks:
      - orderflow-network

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: orderflow
      RABBITMQ_DEFAULT_PASS: orderflow
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - orderflow-network

  rabbitmq-users:
    image: curlimages/curl:8.11.1
    entrypoint: ["sh", "/users.sh"]
    environment:
      RABBITMQ_ADMIN_USER: orderflow
      RABBITMQ_ADMIN_PASSWORD: orderflow
      RABBITMQ_ORDERS_PASSWORD: ${RABBITMQ_ORDERS_PASSWORD:-orders}
      RABBITMQ_PAYMENT_PASSWORD: ${RABBITMQ_PAYMENT_PASSWORD:-payment}
      RABBITMQ_SALES_PASSWORD: ${RABBITMQ_SALES_PASSWORD:-sales}
    volumes:
      - ./docker/rabbitmq/users.sh:/users.sh:ro
    depends_on:
      rabbitmq:
        condition: service_started
    networks:
      - orderflow-network

volumes:
  mysql_data:
  redis_data:
  mongo_data:
  rabbitmq_data:

networks:
  orderflow-network:
    driver: bridge
