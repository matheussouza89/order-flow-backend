
services:
  app:
    build: .
    container_name: orderflow-app
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/orderflow
      SPRING_DATASOURCE_USERNAME: orderflow
      SPRING_DATASOURCE_PASSWORD: orderflow
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      PAYMENT_GATEWAY_URL: http://wiremock:8080
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@orderflow.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-in-production}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-in-production}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - orderflow-network

  wiremock:
    image: wiremock/wiremock:3.9.1
    container_name: orderflow-wiremock
    restart: unless-stopped
    command: ["--global-response-templating", "--verbose"]
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings
    ports:
      - "8090:8080"
    networks:
      - orderflow-network

  mysql:
    image: mysql:8.4
    container_name: orderflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: orderflow
      MYSQL_USER: orderflow
      MYSQL_PASSWORD: orderflow
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-porderflow", "-uorderflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - orderflow-network

  redis:
    image: redis:7-alpine
    container_name: orderflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - orderflow-network

  rabbitmq:
    image: rabbitmq:4-management
    container_name: orderflow-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: orderflow
      RABBITMQ_DEFAULT_PASS: orderflow
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - orderflow-network

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:

networks:
  orderflow-network:
    driver: bridge
