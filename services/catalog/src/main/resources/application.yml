spring:
  application:
    name: catalog

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/catalog}
    username: ${SPRING_DATASOURCE_USERNAME:catalog}
    password: ${SPRING_DATASOURCE_PASSWORD:catalog}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  data:
    web:
      pageable:
        max-page-size: 100

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://monolith:8080/.well-known/jwks.json}

management:
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

orderflow:
  security:
    public-get-paths:
      - /products
      - /products/*
