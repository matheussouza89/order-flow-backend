spring:
  application:
    name: sales

  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017/orderflow}

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:orderflow}
    password: ${SPRING_RABBITMQ_PASSWORD:orderflow}
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://monolith:8080/.well-known/jwks.json}

  http:
    serviceclient:
      orders:
        base-url: ${ORDERS_URL:http://monolith:8080}
        read-timeout: 10s

management:
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
